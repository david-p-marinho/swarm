<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Swarm 79</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .blog-hero   { padding: 100px 36px 40px; text-align: center; background: var(--bg3); border-bottom: 0.5px solid var(--border); }
    .blog-grid   { max-width: 860px; margin: 0 auto; padding: 48px 36px; display: flex; flex-direction: column; gap: 40px; }
    .blog-post   { border-bottom: 0.5px solid var(--border); padding-bottom: 40px; }
    .blog-img    { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; background: var(--bg2); display:flex; align-items:center; justify-content:center; }
    .blog-img i  { font-size: 48px; color: var(--dim); }
    .blog-date   { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .blog-title  { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; color: var(--text); margin-bottom: 12px; }
    .blog-body   { font-size: 14px; color: var(--muted); line-height: 1.8; }
    .blog-tag    { display: inline-block; background: var(--red-dim); color: var(--red); font-size: 10px; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.5px; }
    .back-link   { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--red); margin-bottom: 32px; }
    .back-link:hover { opacity: .75; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo">
      <div class="nav-logo-badge"></div>
      <div class="nav-logo-mark">SWARM 79</div>
    </div>
    <div class="nav-links">
      <a href="index.html#sobre">Sobre Nós</a>
      <a href="index.html#subareas">Sub Áreas</a>
      <a href="index.html#noticias">Notícias</a>
      <a href="index.html#competicoes">Competições</a>
      
    </div>
  </nav>

  <div class="blog-hero">
    <p class="section-eyebrow">Swarm 79</p>
    <h1 class="hero-title" style="font-size:clamp(32px,6vw,56px);">Blog & Notícias</h1>
    <p class="hero-subtitle">Atualizações, conquistas e bastidores da equipe.</p>
  </div>

  <main class="blog-grid" id="blog-grid"></main>

  <script>
  const POSTS = [
    { id:1, tag:"Competição · 2025", date:"Junho 2025",   title:"SAE Brasil Eletroquad 2025",     body:"Texto completo sobre o SAE Brasil Eletroquad 2025. Substitua este texto pelo conteúdo real do post. Você pode adicionar quantos parágrafos quiser." },
    { id:2, tag:"Processo Seletivo", date:"Janeiro 2026", title:"PSEL 2026 — Vagas Abertas",      body:"Texto completo sobre o PSEL 2026. Detalhe as etapas, datas e áreas disponíveis para candidatos." },
    { id:3, tag:"Tecnologia",        date:"Maio 2025",    title:"Novo sistema de visão embarcado", body:"Detalhes sobre a integração do módulo de visão computacional no drone de competição." },
    { id:4, tag:"Evento",            date:"Julho 2025",   title:"Workshop de drones — Jul 2025",  body:"Informações completas sobre inscrições, programação e o que os participantes vão aprender." },
    { id:5, tag:"Equipe",            date:"Março 2025",   title:"Novos membros no time 2025",     body:"Conheça os 8 novos membros que ingressaram na Swarm 79 após o processo seletivo 2025." },
  ];

  const grid = document.getElementById('blog-grid');
  POSTS.forEach(p => {
    const el = document.createElement('article');
    el.className = 'blog-post';
    el.id = `noticia-${p.id}`;
    el.innerHTML = `
      <span class="blog-tag">${p.tag}</span>
      <div class="blog-img"><i class="ti ti-drone" aria-hidden="true"></i></div>
      <p class="blog-date">${p.date}</p>
      <h2 class="blog-title">${p.title}</h2>
      <p class="blog-body">${p.body}</p>`;
    grid.appendChild(el);
  });

  // Scroll automático para a âncora após carregar
  window.addEventListener('load', () => {
    const hash = location.hash;
    if (hash) {
      const el = document.querySelector(hash);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  });
  </script>
</body>
</html>
